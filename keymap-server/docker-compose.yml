# Server sao lưu cài đặt Gamwing (jya2/databases) + trang web tại http://<máy>:8787/admin
# Chạy:   docker compose up -d --build
# Dừng:   docker compose down        (dữ liệu nằm trong volume "ftdata", không mất)
# Tên project cố định: volume dữ liệu là "ft-keymap-server_ftdata" dù thư mục này đổi tên
name: ft-keymap-server
services:
  ft-keymap:
    build: .
    image: ft-keymap-server:local
    container_name: ft-keymap-server
    restart: unless-stopped
    ports:
      # Mặc định mở cho cả mạng nội bộ. Chỉ dùng trên LAN tin cậy, ĐỪNG forward cổng này ra Internet
      # (giao diện quản trị không có đăng nhập). Chỉ máy này truy cập được: đặt BIND=127.0.0.1
      - "${BIND:-0.0.0.0}:${PORT:-8787}:8787"
    environment:
      # Truy cập admin bằng tên miền riêng (không phải IP/tên ngắn/.local/.lan) thì liệt kê ở đây, cách nhau bằng dấu phẩy
      ADMIN_ALLOWED_HOSTS: "${ADMIN_ALLOWED_HOSTS:-}"
      MAX_BODY_BYTES: "${MAX_BODY_BYTES:-8388608}"
      # Múi giờ tính ngày cho thư mục sao lưu theo ngày; BACKUP_KEEP_DAYS=0 nghĩa là giữ hết
      BACKUP_TZ: "${BACKUP_TZ:-Asia/Ho_Chi_Minh}"
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-0}"
    volumes:
      - ftdata:/data

volumes:
  ftdata:
